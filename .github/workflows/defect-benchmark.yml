name: Defect benchmark CPU checks
on:
  pull_request:
    paths: ['defect_benchmark/**', '.github/workflows/defect-benchmark.yml']
  push:
    paths: ['defect_benchmark/**', '.github/workflows/defect-benchmark.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install Pillow==11.3.0
      - run: python -m unittest discover -s defect_benchmark/tests -v
      - name: GPU smoke configuration only (no CUDA or checkpoint download)
        run: python -m defect_benchmark.gpu_smoke --check-only --output /tmp/ddm-gpu-plan
      - run: python -m defect_benchmark.synthetic --output /tmp/defect-fixtures
      - run: python -m defect_benchmark.run --config defect_benchmark/configs/example.json --manifest /tmp/defect-fixtures/manifest.jsonl --backend mock --output /tmp/defect-smoke
      - name: Coordinate input and prompt/output matrix (mock only)
        run: |
          for strategy in definitions geometry contrastive; do
            for mode in constrained strict; do
              python -m defect_benchmark.run --config defect_benchmark/configs/example.json --manifest /tmp/defect-fixtures/coordinates.jsonl --backend mock --prompt-strategy "$strategy" --output-mode "$mode" --output "/tmp/ddm-${strategy}-${mode}"
            done
          done
      - name: Synthetic morphology stress matrix (CPU mock only)
        run: |
          python -m defect_benchmark.stress --output /tmp/ddm-stress --seed 42 --replicates 3
          for strategy in definitions geometry contrastive; do
            for mode in constrained strict; do
              python -m defect_benchmark.run \
                --config defect_benchmark/configs/example.json \
                --manifest /tmp/ddm-stress/coordinates.jsonl --stress-suite \
                --backend mock --prompt-strategy "$strategy" --output-mode "$mode" \
                --output "/tmp/stress-${strategy}-${mode}"
            done
          done
      - run: git diff --exit-code
  transformers-cpu-contracts:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.1 Pillow==11.3.0
      - name: Real CPU library contracts (no checkpoint weights or CUDA)
        run: python -m unittest discover -s defect_benchmark/tests_cpu -v
      - run: git diff --exit-code
